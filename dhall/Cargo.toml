[package]
name = "dhall"
# remember to update html_root_url
version = "0.13.0"
authors = ["NanoTech <nanotech@nanotechcorp.net>", "Nadrieril <nadrieril@users.noreply.github.com>"]
license = "BSD-2-Clause"
description = "Implementation of the Dhall configuration language"
readme = "README.md"
repository = "https://github.com/Nadrieril/dhall-rust"
edition = "2018"
build = "build.rs"
include = ["src/**/*", "README.md", "build.rs"]

[features]
default = [ "reqwest" ]

[[test]]
name = "spec"
harness = false
path = "tests/spec.rs"

[dependencies]
annotate-snippets = "0.12.16"
elsa = "1.11.2"
half = "2.7.1"
hex = "0.4.3"
itertools = "0.15.0"
lazy_static = "1.5.0"
minicbor = { version = "2.3.0", features = ["alloc", "half"] }
# Dhall's Natural and Integer are unbounded. Pure Rust, so wasm still builds.
num-bigint = "0.5.1"
num-traits = "0.2.19"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
pest = "2.9.0"
pest_consume = "1.1.3"
sha2 = "0.11.0"
url = "2.5.8"

# Reqwest needs proper async support to work on wasm. So no remote imports on
# wasm for now.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", features = ["blocking"], optional = true }
home = "0.5.12"

[dev-dependencies]
anyhow = "1.0.104"
colored-diff = "0.2.3"
fs_extra = "1.3.0"
libtest-mimic = "0.8.2"
version-sync = "0.9.5"
walkdir = "2.5.0"

[build-dependencies]
abnf_to_pest = "0.6.0"
pest_generator = "2.9.0"
quote = "1.0.47"
