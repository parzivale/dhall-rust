[package]
name = "sessiond-serde-dhall"
# remember to update html_root_url, README and changelog
version = "1.0.1"
authors = ["Nadrieril <nadrieril@users.noreply.github.com>"]
license = "BSD-2-Clause"
description = "Dhall support for serde"
readme = "../README.md"
repository = "https://github.com/parzivale/dhall-rust"
keywords = ["serde", "serialization", "dhall"]
edition = "2024"
include = ["src/**/*"]

[features]
default = [ "reqwest" ]
reqwest = [ "sessiond-dhall/reqwest" ]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sessiond-dhall = { version = "=1.0.1", path = "../dhall", default-features = false }
sessiond-dhall-proc-macros = { version = "=1.0.1", path = "../dhall_proc_macros" }
doc-comment = "0.3.4"
# Dhall's Natural/Integer are unbounded; this converts them to Rust integers.
num-traits = "0.2.19"
url = "2.5.8"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[dev-dependencies]
version-sync = "0.9.5"

[lints]
workspace = true
