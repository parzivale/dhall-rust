name: Test suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Builds the workspace and runs the whole suite, in both profiles, inside the
  # nix sandbox with no network -- remote imports are served locally by
  # nix/spoof-imports.py.
  checks:
    name: Flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
      - name: Run flake checks
        run: nix flake check --print-build-logs

  # Not a flake check: `wasm-pack test` downloads a matching wasm-bindgen at
  # run time, which the sandbox cannot do. Making it hermetic would mean
  # --mode no-install against nixpkgs' wasm-bindgen-cli.
  test_wasm:
    name: Run wasm tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
      - name: Run tests
        run: nix develop --command wasm-pack test --node serde_dhall
