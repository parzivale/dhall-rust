name: Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Was two grcov jobs driving nightly's `-Zprofile`, which rustc has since
  # removed -- hence the `if: false` and "it's broken, don't know how to fix".
  # `nix build .#coverage` runs the instrumented suite in the sandbox, so this
  # is reproducible locally rather than only in CI.
  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
      - name: Measure coverage
        run: nix build .#coverage --print-build-logs
      - name: Summarise
        run: cat result/summary.txt >> "$GITHUB_STEP_SUMMARY"
      # `result` is a symlink into the nix store, which the actions will not
      # follow; copy the report out first. The copy inherits the store's
      # read-only bits, hence the chmod.
      - name: Stage the report
        run: |
          cp -rL result coverage-report
          chmod -R u+w coverage-report
      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-report/lcov.info
          fail_ci_if_error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-report/lcov.info
            coverage-report/html
