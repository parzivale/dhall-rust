name: Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Was two grcov jobs driving nightly's `-Zprofile`, which rustc has since
  # removed -- hence the `if: false` and "it's broken, don't know how to fix".
  # `nix build .#coverage` runs the instrumented suite in the sandbox, so this
  # is reproducible locally rather than only in CI.
  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
      - name: Measure coverage
        run: nix build .#coverage --print-build-logs
      - name: Summarise
        run: cat result/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            result/lcov.info
            result/html
